# Example: secure npm publish via trusted publishing (OIDC) + staged publish.
#
# Assumes the one-time setup from SKILL.md is done:
#   - npmjs.com: trusted publisher configured for this repo, workflow file
#     "publish.yml", environment "npm-publish" (default: stage publish only)
#   - npmjs.com: package access = "Require 2FA and disallow tokens"
#   - GitHub: environment "npm-publish" with required reviewers;
#     branch protection on main and tag protection on v*
#
# Flow: push a tag (from `npm version` + `git push --follow-tags`)
#   -> gates -> npm stage publish -> maintainer approves with 2FA
#   (`npm stage approve <stage-id>`) -> promote dist-tag when verified.
#
# NOTE: action SHAs below match the tagged releases in the comments
# (verified 2026-09). Re-verify and bump them for your own repo — pin to
# the SHA of the release you audited (`gh api repos/actions/checkout/tags`).

name: publish

on:
  push:
    tags:
      - "v*.*.*" # tag-triggered only; never on branch pushes

# Deny-all by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  gates:
    name: pre-publish gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # >= 22.14.0 (floor for staged/trusted publishing)
      # Lifecycle scripts stay off during install: a compromised transitive
      # dependency must not execute code on the publishing runner.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      # Ship-list review: fail loudly if the tarball would include secrets,
      # tests, or anything not in the `files` allowlist.
      - run: npm pack --dry-run

  publish:
    name: stage publish (OIDC)
    needs: gates
    runs-on: ubuntu-latest
    # Human gate: required reviewers on this environment must approve the
    # job before it runs — in addition to the 2FA stage approval later.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing — no NPM_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # npm >= 11.15.0 required for `npm stage`; update explicitly rather
      # than relying on the runner image.
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Trusted publishing: the CLI exchanges the workflow's OIDC token for
      # short-lived registry credentials. Provenance is attested
      # automatically — do NOT set NPM_CONFIG_PROVENANCE=false.
      #
      # Stable releases stage for `latest`; prereleases (e.g. v1.2.3-beta.1)
      # stage under the `next` dist-tag so `latest` never moves implicitly.
      - run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm stage publish --tag next
          else
            npm stage publish
          fi

# After this workflow succeeds, the release is NOT live yet:
#   1. npm stage list                      # find the stage id
#   2. npm stage view <stage-id>           # inspect metadata
#   3. npm stage download <stage-id>       # audit the exact tarball
#   4. npm stage approve <stage-id>        # prompts for 2FA -> goes live
#   5. verify install + `npm view <pkg> --json` shows dist.attestations
#   6. npm dist-tag add <pkg>@<x.y.z> latest   # promote a `next` release
